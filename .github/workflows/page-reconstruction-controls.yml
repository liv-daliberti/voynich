name: Per-page graph similarity and 75 percent reconstruction
on:
  workflow_dispatch:
  push:
    branches:
      - page-graph-heterogeneity
    paths:
      - experiments/page_graphs/reconstruct_controls.py
      - .github/workflows/page-reconstruction-controls.yml
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cohort: [Voynich, Austen, Naibbe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch original texts and freeze fingerprints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data results/page_reconstruction_controls
          curl -fsSL --retry 3 -o data/ZL3b-n.txt https://raw.githubusercontent.com/matthewdgreen/cipher_benchmark/main/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          curl -fsSL --retry 3 -o data/1342-0.txt https://raw.githubusercontent.com/GITenberg/Pride-and-Prejudice_1342/master/1342-0.txt
          curl -fsSL --retry 3 -o data/naibbe.txt https://raw.githubusercontent.com/greshko/naibbe-cipher/main/encrypted/nathist_output_ciphertext.txt
          sha256sum data/* > results/page_reconstruction_controls/source_sha256.txt
      - name: Reconstruct 75 percent hidden per-page vocabulary, compute near/far structure
        run: python experiments/page_graphs/reconstruct_controls.py --zl data/ZL3b-n.txt --austen data/1342-0.txt --naibbe data/naibbe.txt --masks 500 --page-shuffles 500 --cohort ${{ matrix.cohort }} --out results/page_reconstruction_controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-graphs-${{ matrix.cohort }}
          path: results/page_reconstruction_controls/
          retention-days: 30
          if-no-files-found: warn
