name: Quire and section aware folio structure nulls
on:
  workflow_dispatch:
  push:
    branches: [same-target-source-conditioning]
    paths:
      - experiments/same_target_source/**
      - tests/test_quire_section_nulls.py
      - .github/workflows/quire-section-nulls.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch input and fingerprint transcription
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data results/quire_section
          curl -fsSL --retry 3 -o data/ZL3b-n.txt https://raw.githubusercontent.com/matthewdgreen/cipher_benchmark/main/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sha256sum data/ZL3b-n.txt > results/quire_section/source_sha256.txt
      - name: Run quire, section, hand and source-size aware nulls
        run: python experiments/same_target_source/quire_section_nulls.py --zl data/ZL3b-n.txt --out results/quire_section/summary.json --permutations 120
      - name: High-resolution constrained graph-order nulls (2,000 draws)
        run: python experiments/same_target_source/quire_section_nulls.py --zl data/ZL3b-n.txt --out results/quire_section/high_resolution_graph.json --permutations 2000 --graph-only --nulls currier_quire currier_section_quire currier_section_quire_hand currier_section_quire_hand_size
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quire-section-page-null-results
          path: results/quire_section
          retention-days: 30
          if-no-files-found: warn
