name: Cross-page reconstruction and fresh self-citation generator controls
on:
  workflow_dispatch:
  push:
    branches:
      - cross-page-reconstruction
    paths:
      - experiments/cross_page/**
      - tests/test_cross_page.py
      - .github/workflows/cross-page-reconstruction.yml

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        cohort: [voynich, austen, naibbe, timm19, timm23, timm29, timm31, timm37]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch independent source corpora
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data results/cross_page
          curl -fsSL --retry 3 -o data/ZL3b-n.txt https://raw.githubusercontent.com/matthewdgreen/cipher_benchmark/main/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          curl -fsSL --retry 3 -o data/1342-0.txt https://raw.githubusercontent.com/GITenberg/Pride-and-Prejudice_1342/master/1342-0.txt
          curl -fsSL --retry 3 -o data/naibbe.txt https://raw.githubusercontent.com/greshko/naibbe-cipher/main/encrypted/nathist_output_ciphertext.txt
          sha256sum data/* > results/cross_page/source_sha256.txt
      - name: Install Java for the unmodified released Timm-Schinner generator
        if: startsWith(matrix.cohort, 'timm')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate a fresh manuscript using the released Java executable
        if: startsWith(matrix.cohort, 'timm')
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/TorstenTimm/SelfCitationTextgenerator.git data/timm_upstream
          git -C data/timm_upstream checkout --detach a6ede2202dd7ad6285ce2c007bf22c2a0e7709b7
          cd data/timm_upstream/executable
          SEED="${{ matrix.cohort }}"
          SEED="${SEED#timm}"
          sed -i "s/^method.random.pseudo.seed=.*/method.random.pseudo.seed=${SEED}/" conf.properties
          sed -i 's/^text.lines_to_create=.*/text.lines_to_create=5000/' conf.properties
          java -jar text-generator.jar
          test -s generate/generated_text.txt
          cp generate/generated_text.txt ../../timm_generated.txt
          cd ../../..
          sha256sum data/timm_generated.txt data/timm_upstream/executable/conf.properties data/timm_upstream/executable/text-generator.jar >> results/cross_page/source_sha256.txt
          printf 'Upstream generator commit: ' >> results/cross_page/source_sha256.txt
          git -C data/timm_upstream rev-parse HEAD >> results/cross_page/source_sha256.txt
          cp data/timm_upstream/executable/conf.properties results/cross_page/generator_config.properties
      - name: Cross-page source-only top-50 prediction, distance and reverse tests
        shell: bash
        run: |
          set -euo pipefail
          COHORT="${{ matrix.cohort }}"
          if [[ "${COHORT}" == timm* ]]; then
            SEED="${COHORT#timm}"
            python experiments/cross_page/reconstruct.py --zl data/ZL3b-n.txt --generated data/timm_generated.txt --mode timm --seed "${SEED}" --shuffles 300 --out "results/cross_page/${COHORT}.json"
          elif [[ "${COHORT}" == "voynich" ]]; then
            python experiments/cross_page/reconstruct.py --zl data/ZL3b-n.txt --mode voynich --shuffles 300 --out "results/cross_page/${COHORT}.json"
          elif [[ "${COHORT}" == "austen" ]]; then
            python experiments/cross_page/reconstruct.py --zl data/ZL3b-n.txt --austen data/1342-0.txt --mode austen --shuffles 300 --out "results/cross_page/${COHORT}.json"
          else
            python experiments/cross_page/reconstruct.py --zl data/ZL3b-n.txt --naibbe data/naibbe.txt --mode naibbe --shuffles 300 --out "results/cross_page/${COHORT}.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-page-${{ matrix.cohort }}
          path: results/cross_page
          retention-days: 30
          if-no-files-found: warn
